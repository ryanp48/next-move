    border-radius:100px;
    letter-spacing:0.04em;

  .hero-title{
    font-family:'Fraunces',serif;
    font-weight:900;
    font-size:clamp(34px,7vw,52px);
    line-height:1.02;
    text-align:center;
    margin:22px 0 6px;
    letter-spacing:-0.01em;
  }
  .hero-title em{

    background:linear-gradient(120deg, var(--gold) 10%, var(--gold-bright) 50%, var(--gold) 90%);

    background-clip:text;

    color:var(--cream-dim);
    font-size:15.5px;
    max-width:420px;
    margin:0 0 30px;
    line-height:1.5;

    grid-template-columns:1fr;
    gap:12px;

  .mode-btn{
    text-align:left;
    background:var(--surface-2);
    border:1px solid rgba(217,174,63,0.16);
    border-radius:14px;
    padding:18px 20px;
    color:var(--cream);

    font-family:'Inter',sans-serif;
    transition:border-color .18s ease, transform .12s ease, background .18s ease;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;

    font-weight:600;
    font-size:19px;
    margin-bottom:3px;

    font-size:13.5px;

  .mode-btn .suit-chip{

    border-radius:50%;

    color:var(--gold-bright);

    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow:inset 0 0 0 2px rgba(217,174,63,0.15);

    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .progress span{
    height:4px;
    flex:1;
    border-radius:4px;
    background:rgba(217,174,63,0.15);
    overflow:hidden;
  }
  .progress span i{
    display:block;
    height:100%;
    width:0%;
    background:var(--gold);
    transition:width .3s ease;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;

  .q-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 18px;
    line-height:1.2;

  .opt-btn{
    background:var(--surface-2);
    border:1px solid rgba(217,174,63,0.14);
    border-radius:12px;
    padding:14px 16px;
    color:var(--cream);
    text-align:left;
    cursor:pointer;

    border:none;
    color:var(--cream-dim);

    font-size:12px;
    letter-spacing:.04em;
    cursor:pointer;
    padding:4px 0;
  }
  .back-link:hover{color:var(--cream);}

  /* ---- step: wheel ---- */
  .wheel-stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .wheel-holder{
    position:relative;
    width:min(320px,78vw);
    height:min(320px,78vw);
    margin:6px 0 22px;
  }
  .pointer{
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:13px solid transparent;
    border-right:13px solid transparent;
    border-top:24px solid var(--gold-bright);
    z-index:5;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.5));
  }
  .pointer::after{
    content:'';
    position:absolute;
    top:-24px; left:-13px;
    width:26px; height:26px;
  }
  .wheel{
    width:100%;
    height:100%;
    border-radius:50%;
    position:relative;
    transition:transform 3.2s cubic-bezier(.17,.89,.32,1.02);
    will-change:transform;
    filter:drop-shadow(0 22px 40px rgba(0,0,0,0.55));
  }
  .wheel svg{ display:block; width:100%; height:100%; }

  .spin-btn{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:14px;

    color:#241804;
    border:none;
    padding:15px 34px;
    border-radius:100px;
    cursor:pointer;

  .spin-btn:disabled{opacity:0.4; cursor:not-allowed; box-shadow:none;}

    align-items:center;
    gap:6px;

    color:var(--cream);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    padding:9px 16px;
    border-radius:100px;
    cursor:pointer;
    transition:background .15s ease;

  .buy-btn:hover{background:rgba(154,27,51,0.32);}
  .demo-note{
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.75;
    text-align:center;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,10,7,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-card{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg, #17402C, #0F2A1C);

    border-radius:18px;
    padding:24px;
      max-height:85vh;
  overflow-y:auto;

    font-weight:700;
    font-size:20px;
    margin:0 0 4px;

  .modal-sub{
    font-size:13px;
    color:var(--cream-dim);

  }
  #paymentElement{

  }
  .modal-actions{
    display:flex;
    gap:10px;
  }
  .pay-btn{
    flex:1;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241804;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:12.5px;
    padding:13px 18px;
    border-radius:100px;
    cursor:pointer;
  }
  .pay-btn:disabled{opacity:.5; cursor:not-allowed;}
  .cancel-btn{
    background:none;
    border:1px solid rgba(237,232,220,0.25);
    color:var(--cream-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    padding:13px 18px;
    border-radius:100px;
    cursor:pointer;
  }
  .modal-error{
    color:#F0A0A0;
    font-size:12.5px;
    margin:0 0 12px;
    min-height:0;
  }

  /* ---- result ---- */
  .result{
    width:100%;
    margin-top:24px;
    padding-top:22px;
    border-top:1px solid rgba(217,174,63,0.2);

  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .flavor-tag{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#241804;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    padding:4px 10px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .idea-title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:23px;
    margin:0 0 10px;
    line-height:1.2;
  }
  .idea-desc{
    font-size:15.5px;
    line-height:1.55;
    color:#E6E0D2;
    margin:0 0 10px;
  }
  .idea-twist{
    font-size:14px;
    line-height:1.5;
    color:var(--cream-dim);
    border-left:2px solid var(--red);
    padding-left:12px;
    margin:14px 0;
  }
  .idea-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--cream-dim);
    letter-spacing:.02em;
    margin-bottom:20px;
  }
  .result-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .again-btn{
    flex:1;
    min-width:140px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241804;
    border:none;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-size:12.5px;
    padding:13px 18px;
    border-radius:100px;
    cursor:pointer;
  }
  .again-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .start-over-btn{
    background:none;
    border:1px solid rgba(217,174,63,0.35);
    color:var(--cream-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.03em;
    padding:13px 18px;
    border-radius:100px;
    cursor:pointer;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--surface-2);
    border:1px solid var(--gold);
    color:var(--cream);
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:88vw;
    text-align:center;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  footer{
    margin-top:26px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--cream-dim);
    opacity:.6;
    text-align:center;
  }
</style>

function buildWheelSVG(){
  const fullSegs = currentSegments();
  const shortSegs = currentShortSegments();
  const n = fullSegs.length;
  const anglePer = 360/n;
  const cx=150, cy=150, r=140;
  const toRad = d => d*Math.PI/180;

  let paths = '';
  let labels = '';

  for(let i=0;i<n;i++){
    const a0 = i*anglePer;
    const a1 = (i+1)*anglePer;
    const mid = a0 + anglePer/2;

    const x0 = cx + r*Math.sin(toRad(a0));
    const y0 = cy - r*Math.cos(toRad(a0));
    const x1 = cx + r*Math.sin(toRad(a1));
    const y1 = cy - r*Math.cos(toRad(a1));

    const color = i % 2 === 0 ? '#15130F' : '#9A1B33';
    paths += `<path d="M ${cx} ${cy} L ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${color}" stroke="#D9AE3F" stroke-width="1.5"/>`;

    const labelR = r*0.63;
    const lx = cx + labelR*Math.sin(toRad(mid));
    const ly = cy - labelR*Math.cos(toRad(mid));
    const rot = mid;

    labels += `<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${lx.toFixed(2)} ${ly.toFixed(2)})" text-anchor="middle" dominant-baseline="middle" fill="#F5EDE0" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="13">${shortSegs[i]}</text>`;
  }

  return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <circle cx="150" cy="150" r="147" fill="none" stroke="#D9AE3F" stroke-width="5"/>
    <circle cx="150" cy="150" r="141" fill="none" stroke="#241804" stroke-width="1"/>
    ${paths}
    ${labels}
    <circle cx="150" cy="150" r="27" fill="#15130F" stroke="#D9AE3F" stroke-width="3"/>
    <circle cx="150" cy="150" r="15" fill="#9A1B33" stroke="#D9AE3F" stroke-width="2"/>
  </svg>`;
}

function buildWheelMarkup(){
  return `

      <div class="wheel" id="wheelEl" style="transform:rotate(${state.rotation}deg);">

async function doSpin(){
  if(state.spinning) return;
  if(totalSpins()<=0){ openPaymentModal(); return; }

  state.spinning = true;
  const spinBtn = el('spinBtn');
  spinBtn.disabled = true;
  spinBtn.textContent = 'Spinning…';

  let authorized = false;
  try{
    const res = await fetch(`${API_BASE}/api/spin`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({visitorId: VISITOR_ID})
    });
    const data = await res.json();
    if(data.ok){
      authorized = true;
      state.freeRemaining = data.freeRemaining;
      state.paidSpins = data.paidSpins;
      state.everSpun = true;
    } else {
      showToast("Looks like you're out of spins.");
      openPaymentModal();
    }
  } catch(err){
    console.error(err);
    showToast("Couldn't reach the server — try again in a moment.");
  }
  updateTokenDisplay();

  if(!authorized){
    state.spinning = false;
    spinBtn.disabled = false;
    spinBtn.textContent = totalSpins()>0 ? 'Spin the wheel' : 'Out of spins';
    if(totalSpins()<=0) renderWheel();
    return;
  }

  const segs = currentSegments();
  const n = segs.length;
  const angle = 360/n;
  let pool = [];
  for(let i=0;i<n;i++){ if(i !== state.lastIndex) pool.push(i); }
  if(pool.length === 0) pool = [...Array(n).keys()];
  const targetIndex = pool[Math.floor(Math.random()*pool.length)];
  state.lastIndex = targetIndex;

  const desiredMod = (360 - (targetIndex*angle + angle/2)) % 360;
  const currentMod = ((state.rotation % 360) + 360) % 360;
  let delta = (desiredMod - currentMod + 360) % 360;
  const extraSpins = 4 + Math.floor(Math.random()*2);
  state.rotation = state.rotation + delta + extraSpins*360;

  const wheelEl = el('wheelEl');
  wheelEl.style.transform = `rotate(${state.rotation}deg)`;

  setTimeout(()=>{
    state.spinning = false;
    revealResult(segs[targetIndex]);
    spinBtn.disabled = totalSpins()<=0;
    spinBtn.textContent = totalSpins()>0 ? 'Spin again' : 'Out of spins';
    if(totalSpins()<=0){
      const buyRow = document.querySelector('.buy-row');
      if(buyRow && !el('buyBtn')){
        buyRow.innerHTML = `<button class="buy-btn" id="buyBtn">Buy 5 spins — $1</button><div class="demo-note">2 free spins on the house · then $1 for 5 more</div>`;
        el('buyBtn').addEventListener('click', openPaymentModal);
      }
    }
  }, 3300);
}

      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({visitorId: VISITOR_ID})
    });
    const data = await res.json();
    if(!data.clientSecret) throw new Error(data.error || 'No client secret returned');

    stripeElements = stripe.elements({clientSecret: data.clientSecret, appearance:{theme:'night', variables:{colorPrimary:'#D9AE3F'}}});
    const paymentElement = stripeElements.create('payment');
    paymentElement.mount('#paymentElement');
    el('payConfirm').disabled = false;

    el('payConfirm').addEventListener('click', async ()=>{
      el('payConfirm').disabled = true;
      el('payConfirm').textContent = 'Processing…';
      const { error, paymentIntent } = await stripe.confirmPayment({
        elements: stripeElements,
        confirmParams: { return_url: window.location.href },
        redirect: 'if_required'
      });
      if(error){
        el('payError').textContent = error.message || 'Payment failed. Try again.';
        el('payConfirm').disabled = false;
        el('payConfirm').textContent = 'Pay $1';
        return;
      }
      if(paymentIntent && paymentIntent.status === 'succeeded'){
        el('payConfirm').textContent = 'Adding your spins…';
        await pollForCredit();
        closePaymentModal();
        showToast('Payment received — 5 spins added!');
        renderWheel();
      }
    });
  } catch(err){
    console.error(err);
    el('paymentElement').textContent = "Couldn't load the payment form.";
    el('payError').textContent = err.message;
  }
}

function closePaymentModal(){
  const overlay = el('payOverlay');
  if(overlay) overlay.remove();
  stripeElements = null;
}

async function pollForCredit(){
  const before = state.paidSpins;
  for(let i=0;i<6;i++){
    await new Promise(r=>setTimeout(r, 1000));
    await refreshStatus();
    if(state.paidSpins > before) return;
  }
}

function revealResult(flavorOrCategory){
  let mode = state.mode;
  if(mode === 'surprise'){
    mode = Math.random() < 0.5 ? 'biz' : 'today';
  }

  let html = '';
  if(mode === 'biz'){
    const interestKey = state.answers.interest || pick(Object.keys(BIZ_IDEAS));
    const idea = pick(BIZ_IDEAS[interestKey]);
    const flavor = state.mode === 'biz' ? flavorOrCategory : pick(BIZ_FLAVORS);
    const twist = BIZ_TWISTS[flavor];
    const time = state.answers.time || 'flexible time';
    const budget = state.answers.budget || 'any budget';
    html = `
      <div class="result">
      <div class="eyebrow">Wheel of Next has spoken</div>

        <div class="flavor-tag">${flavor}</div>
        <h3 class="idea-title">${idea.t}</h3>
        <p class="idea-desc">${idea.d}</p>
        <p class="idea-twist">${twist}</p>
        <div class="idea-meta">TIME: ${time.toUpperCase()} · BUDGET: ${budget.toUpperCase()}</div>
        <div class="result-actions">
          <button class="again-btn" id="againBtn" ${totalSpins()<=0?'disabled':''}>Spin again</button>
          <button class="start-over-btn" id="overBtn">Start over</button>
        </div>
      </div>
    `;
  } else {
    const category = state.mode === 'today' ? flavorOrCategory : pick(TODAY_CATEGORIES);
    const idea = pick(TODAY_IDEAS[category]);
    const time = state.answers.time || 'some time';
    const energy = state.answers.energy || 'whatever energy you\'ve got';
    const social = state.answers.social || 'however you feel like it';
    html = `
      <div class="result">
      <div class="eyebrow">Wheel of Next has spoken</div>

        <div class="flavor-tag">${category}</div>
        <h3 class="idea-title">${idea}</h3>
        <p class="idea-twist">Fits what you've got: ${time.toLowerCase()}, ${energy.toLowerCase()} energy, ${social.toLowerCase()}.</p>
        <div class="result-actions">
          <button class="again-btn" id="againBtn" ${totalSpins()<=0?'disabled':''}>Spin again</button>
          <button class="start-over-btn" id="overBtn">Start over</button>
        </div>
      </div>
    `;
  }

  el('resultZone').innerHTML = html;
  el('againBtn').addEventListener('click', doSpin);
  el('overBtn').addEventListener('click', ()=>{
    state.mode = null;
    state.step = 'mode';
    state.answers = {};
    state.qIndex = 0;
    renderMode();
  });
}

/* ---------------- INIT ---------------- */
renderMode();
refreshStatus();

</script>
</body>
</html>
